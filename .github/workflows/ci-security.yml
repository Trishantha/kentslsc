name: CI Security Gates

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build workspace
        env:
          # Required by apps/web/next.config.js during next build (production mode).
          # Placeholders are sufficient for CI; real deployments set these per app.
          API_PROXY_TARGET: http://localhost:3001
          NEXT_PUBLIC_SOCKET_URL: http://localhost:3001
          FRONTEND_URL: http://localhost:3000
        run: corepack pnpm build

      - name: Run smoke tests
        run: corepack pnpm test

  security-audit:
    name: Production Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Block high/critical vulnerabilities
        run: corepack pnpm audit --prod --audit-level=high
