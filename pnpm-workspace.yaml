packages:
  - 'apps/*'
  - 'packages/*'

overrides:
  body-parser: ^1.20.6
  file-type: ^21.3.2
  js-yaml: ^4.1.2
  lodash: ^4.17.23
  multer: ^2.2.0
  postcss: ^8.5.23
  qs: ^6.15.2
  sharp: ^0.35.0

allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  bcrypt: true
  core-js: set this to true or false
  esbuild: false
  prisma: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - 'bcrypt'
  - 'prisma'
  - 'sharp'
  - 'unrs-resolver'
