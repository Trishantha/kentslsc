packages:
  - 'apps/*'
  - 'packages/*'

# Hostinger's hbuilds deploy copy dereferences pnpm's symlinked node_modules, so
# packages reachable only through .pnpm real paths (transitive deps such as
# next's own @next/env, styled-jsx, caniuse-lite, postcss, @swc/helpers) become
# unresolvable at runtime and the web handler crash-loops. Hoist every
# dependency into the root node_modules so plain Node walk-up resolution finds
# them regardless of how the host copies symlinks.
publicHoistPattern:
  - '*'

# The hoisting change (and any future linker-affecting change) makes pnpm purge
# and relink node_modules on the next install. Hostinger's build has no TTY, and
# pnpm aborts that purge without confirmation, failing the whole deploy.
confirmModulesPurge: false

overrides:
  body-parser: ^1.20.6
  deepmerge-ts: ^8.0.0
  file-type: ^21.3.2
  js-yaml: ^4.1.2
  lodash: ^4.17.23
  mysql2: ^3.22.0
  multer: ^2.2.0
  postcss: ^8.5.23
  qs: ^6.15.2
  sharp: ^0.35.0
  fast-uri: ^3.1.6
  xlsx: https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz

allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  bcrypt: true
  core-js: true
  esbuild: false
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - 'bcrypt'
  - 'prisma'
  - 'sharp'
  - 'unrs-resolver'

patchedDependencies:
  gocardless-nodejs: patches/gocardless-nodejs.patch
